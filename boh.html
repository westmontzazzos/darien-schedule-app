<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Zazzo's — BOH Schedule</title>
<link rel="apple-touch-icon" id="ti-apple">
<link rel="icon" type="image/png" id="ti-fav">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOH Schedule">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --red:#E31010; --black:#0D0D0D; --white:#FFFFFF; --off-white:#F8F7F5; --gray-50:#FAFAF9; --gray-100:#F0EFED; --gray-200:#E2E0DC; --gray-400:#A8A49E; --gray-600:#6B6660; --gray-800:#2D2926; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--off-white); font-family:'DM Sans',Arial,sans-serif; color:var(--gray-800); overscroll-behavior:none; }
body{ display:flex; flex-direction:column; }
[hidden]{ display:none !important; }

/* ---- PIN / name screens ---- */
.gate{ position:fixed; inset:0; z-index:50; background:var(--black); display:flex; align-items:center; justify-content:center; padding:24px; }
.gate-card{ width:100%; max-width:340px; text-align:center; color:#fff; }
.gate-card img{ width:84px; height:84px; border-radius:18px; }
.gate-card h1{ font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:34px; letter-spacing:.08em; margin:14px 0 4px; }
.gate-card p{ margin:0 0 18px; color:#bbb; font-size:14px; }
.gate-card input{ width:100%; font:600 24px 'DM Sans',sans-serif; text-align:center; letter-spacing:.3em; padding:14px; border-radius:12px; border:2px solid #444; background:#1a1a1a; color:#fff; outline:none; }
.gate-card input.name{ letter-spacing:0; font-size:20px; }
.gate-card input:focus{ border-color:var(--red); }
.gate-card button{ width:100%; margin-top:12px; padding:14px; font:600 16px 'DM Sans',sans-serif; border:none; border-radius:12px; background:var(--red); color:#fff; }
.gate-err{ min-height:20px; margin-top:10px; color:#ff8a8a; font-size:14px; }

/* ---- top bar ---- */
#topbar{ flex:none; background:var(--black); color:#fff; padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px; }
#topbar .row1{ display:flex; align-items:center; gap:10px; }
#topbar img{ width:30px; height:30px; border-radius:7px; }
#topbar .ttl{ font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.09em; flex:1; }
#topbar .who{ font-size:11px; color:#aaa; max-width:42vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#topbar .row2{ display:flex; align-items:center; gap:8px; margin-top:8px; }
.wk{ display:flex; align-items:center; gap:6px; flex:1; min-width:0; }
.wk button, #refresh{ flex:none; width:34px; height:34px; border-radius:9px; border:1px solid #444; background:#1f1f1f; color:#fff; font-size:20px; line-height:1; padding:0; }
#weeklabel{ font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.07em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#savebtn{ flex:none; height:34px; padding:0 16px; border:none; border-radius:999px; font:600 14px 'DM Sans',sans-serif; background:#3a3a3a; color:#888; }
#savebtn.on{ background:var(--red); color:#fff; }
#photoBtn{ width:100%; margin-top:8px; height:40px; border-radius:10px; border:2px solid var(--red); background:#1a1a1a; color:#fff; font:600 15px 'DM Sans',sans-serif; }
.spin{ width:46px; height:46px; margin:0 auto 6px; border:5px solid #333; border-top-color:var(--red); border-radius:50%; animation:sp 0.9s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
.xl thead th .ev{ font-size:10px; font-weight:700; color:#ff8a8a; letter-spacing:0; margin-top:1px; white-space:normal; line-height:1.05; }
#banner{ flex:none; background:#fff3b0; color:#5c4a00; font-size:13px; padding:8px 14px; border-bottom:1px solid #e6d98a; }

/* ---- the sheet ---- */
#sheet{ flex:1 1 auto; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; background:#fff; }
table.xl{ border-collapse:separate; border-spacing:0; table-layout:fixed; width:max(100%, 700px); background:#fff; }
.xl th, .xl td{ height:44px; padding:0; border-bottom:1px solid var(--gray-100); font-size:15px; text-align:center; }
.xl thead th{ position:sticky; top:0; z-index:5; background:var(--black); color:#fff; height:46px; font-weight:600; font-size:13px; letter-spacing:.04em; line-height:1.15; }
.xl thead th.nm{ z-index:7; text-align:left; padding-left:12px; background:var(--black); color:#fff; border-right:none; }
.xl th.nm{ position:sticky; left:0; z-index:3; width:104px; min-width:104px; text-align:left; padding:0 6px 0 12px; font-weight:500; background:var(--gray-50); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-right:1px solid var(--gray-100); }
.xl tr.bar td{ height:28px; background:var(--red); color:#fff; text-align:left; padding-left:12px; font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; border-bottom:none; }
.xl td{ background:#fff; }
.xl td.opener{ background:#fff3b0; } .xl td.closer{ background:#cde8f5; }
.xl td.bad{ background:#ffd6d6 !important; }
.xl td.chg{ box-shadow:inset 3px 0 0 var(--red); }
.xl input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font:500 16px 'DM Sans',sans-serif; color:var(--gray-800); text-transform:uppercase; padding:0 2px; outline:none; border-radius:0; -webkit-appearance:none; }
.xl input:focus{ outline:2px solid var(--red); outline-offset:-2px; background:rgba(255,255,255,.7); }
.xl td.empty-note{ color:var(--gray-400); font-style:italic; text-align:left; padding-left:12px; }

#foot{ flex:none; display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px)); background:var(--off-white); border-top:1px solid var(--gray-200); font-size:12px; color:var(--gray-600); }
#foot a{ color:var(--red); text-decoration:none; white-space:nowrap; }
#toast{ position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--black); color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; font-weight:600; z-index:80; opacity:0; pointer-events:none; transition:opacity .25s; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; } #toast.err{ background:var(--red); }
</style>
</head>
<body>

<!-- PIN -->
<div class="gate" id="pinGate">
  <div class="gate-card">
    <img data-icon alt="">
    <h1>BOH SCHEDULE</h1>
    <p>Enter your PIN</p>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="PIN">
    <button id="pinGo" type="button">Open</button>
    <div class="gate-err" id="pinErr"></div>
  </div>
</div>

<!-- first-time name -->
<div class="gate" id="nameGate" hidden>
  <div class="gate-card">
    <img data-icon alt="">
    <h1>WHO'S THIS?</h1>
    <p>Your name, so the schedule shows who changed it</p>
    <input id="nameInput" class="name" type="text" maxlength="30" autocomplete="off" autocapitalize="words" aria-label="Your name">
    <button id="nameGo" type="button">Continue</button>
    <div class="gate-err" id="nameErr"></div>
  </div>
</div>

<div id="topbar" hidden>
  <div class="row1"><img data-icon alt=""><div class="ttl">BOH SCHEDULE</div><div class="who" id="who"></div></div>
  <div class="row2">
    <div class="wk"><button id="prevWk" type="button" aria-label="Earlier week">‹</button><div id="weeklabel">…</div><button id="nextWk" type="button" aria-label="Later week">›</button></div>
    <button id="refresh" type="button" aria-label="Reload" title="Reload from the database">⟳</button>
    <button id="savebtn" type="button" disabled>Saved</button>
  </div>
  <button id="photoBtn" type="button">📷 Upload schedule photo</button>
</div>
<input type="file" id="photoFile" accept="image/*" hidden>
<div class="gate" id="keyGate" hidden>
  <div class="gate-card">
    <h1>AI KEY</h1>
    <p>Paste the Anthropic API key once so the app can read schedule photos. It is saved on this phone only.</p>
    <input id="keyInput" class="name" type="password" placeholder="sk-ant-..." autocomplete="off" aria-label="API key">
    <button id="keyGo" type="button">Save key</button>
    <button id="keyCancel" type="button" style="background:#333">Cancel</button>
    <div class="gate-err" id="keyErr"></div>
  </div>
</div>
<div class="gate" id="busy" hidden style="z-index:90;background:rgba(0,0,0,.88)">
  <div class="gate-card"><div class="spin"></div><h1 id="busyTitle">READING…</h1><p id="busyMsg"></p></div>
</div>
<div id="banner" hidden></div>
<div id="sheet" hidden></div>
<div id="foot" hidden><span id="lastEdit"></span><a href="#" id="signOut">Sign out</a></div>
<div id="toast"></div>

/* ---- database ---- */
async function req(path, opts){
  opts = opts || {};
  var headers = Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}, opts.headers||{});
  var r = await fetch(SUPABASE_URL+'/rest/v1/'+path, Object.assign({}, opts, {headers:headers}));
  if(!r.ok){ var t=''; try{ t=await r.text(); }catch(e){} throw new Error('HTTP '+r.status+(t?': '+t.slice(0,160):'')); }
  return r;
}
async function getJSON(path){ return (await req(path)).json(); }

/* ---- names ---- */
function cleanNames(obj){            // same rules the Darien app uses when it loads a week
  var cleaned = {};
  Object.keys(obj||{}).forEach(function(name){
    var key = name.replace(/\s*\([\d\s\-\.]+\)/g,'').trim();
    var al = NAME_ALIASES[key.toLowerCase()]; if(al) key = al;
    if(cleaned[key] !== undefined){
      var ex = cleaned[key], inc = obj[name], merged = [];
      for(var i=0;i<7;i++){ var ev=ex&&ex[i], iv=inc&&inc[i]; merged[i]=(ev!==null&&ev!==undefined&&ev!=='')?ev:(iv!==undefined?iv:null); }
      cleaned[key] = merged;
    } else cleaned[key] = obj[name];
  });
  return cleaned;
}

  ROLE_OVERRIDES = {}; (res[3]||[]).forEach(function(r){ try{ ROLE_OVERRIDES[r.original_name] = JSON.parse(r.roles_json||'[]'); }catch(e){} });
}
// everyone whose job puts them in a back-of-house section, so they always have a row to type into
function seededNames(){
  var out = {}; BOH_SECTIONS.forEach(function(s){ out[s[0]] = {}; });
  function add(name, roles){ (roles||[]).forEach(function(r){ var sec = ROLE_TO_SECTION[r]; if(sec) out[sec][name] = 1; }); }
  Object.keys(DEFAULT_ROSTER).forEach(function(n){ if(REMOVED[n]) return; add(n, ROLE_OVERRIDES[n] || DEFAULT_ROSTER[n].map(function(x){return x.role;})); });
  CUSTOM.forEach(function(p){ if(p.is_salaried || REMOVED[p.name]) return; var roles=[]; try{ roles = ROLE_OVERRIDES[p.name] || JSON.parse(p.roles_json||'[]'); }catch(e){} add(p.name, roles); });
  Object.keys(ROLE_OVERRIDES).forEach(function(n){ if(!REMOVED[n]) add(n, ROLE_OVERRIDES[n]); });

/* ---- one shift: one format ---- */
function guessAmPm(h){ h=+h; return ((h>=1&&h<=8)||h===12) ? 'PM' : 'AM'; }   // kitchen day: 1-8 and 12 are afternoon, 9-11 are morning
function h24(h, ap){ h=+h%12; return ap==='PM' ? h+12 : h; }
function fmtT(h24v, mm){ var ap = h24v>=12 ? 'PM':'AM'; var h = h24v%12; if(h===0) h=12; return h + (mm&&mm!=='00' ? ':'+mm : '') + ap; }
var TIME_RE = /^(\d{1,2})(?::?(\d\d))?(AM|PM|A|P)?(?:-(?:(C)|(\d{1,2})(?::?(\d\d))?(AM|PM|A|P)?))?$/;
function normShift(v){
  var s = String(v==null?'':v).trim(); if(!s) return '';
  s = s.replace(/[\u2013\u2014]/g,'-');
  var u = s.toUpperCase();
  if(u==='OFF') return 'OFF'; if(u==='X') return 'X';
  var t = u.replace(/\s+/g,'').replace(/-(CLOSE|CLS|CL)$/,'-C').replace(/\/(CLOSE|CLS|CL|C)$/,'-C');
  var m = t.match(TIME_RE);
  if(!m) return u.replace(/\s*-\s*/g,'-');       // a note (KITCHEN, PREP...) stays as typed, capitalised
  var sh = +m[1], smm = m[2]||'';
  if(sh>23) return u;
  var sap = m[3] ? (m[3][0]==='A'?'AM':'PM') : (sh>12 ? (sh>=12?'PM':'AM') : guessAmPm(sh));
  var s24 = sh>12 ? sh : h24(sh, sap);
  var out = fmtT(s24, smm);
  if(m[4]==='C') return out+'-C';
  if(m[5]){
    var eh = +m[5], emm = m[6]||'', e24;
    if(eh>23) return u;
    if(m[7]) e24 = h24(eh, m[7][0]==='A'?'AM':'PM');
    else if(eh>12) e24 = eh;
    else { e24 = h24(eh,'AM'); if(e24 <= s24) e24 = h24(eh,'PM'); }   // the end is whichever comes after the start
    out += '-' + fmtT(e24, emm);
  }
  return out;
}
var CANON_RE = /^\d{1,2}(:\d\d)?(AM|PM)(-(C|\d{1,2}(:\d\d)?(AM|PM)))?(\/[A-Z]+)?$/;
function looksBad(v){ return /^\d/.test(v) && !CANON_RE.test(v); }          // starts like a time but isn't a clean one
function shadeClass(v){                                                       // same opener / closer colours as the main schedule
  var s = String(v||'').trim().toLowerCase().replace(/\s+/g,''); if(!s) return '';
  if(/[-\/](c|cl|close)$/.test(s)) return 'closer';
  if(/^9(:00)?pm/.test(s)) return '';
  if(/^9(:00)?(am)?($|[-\/])/.test(s)) return 'opener';
  return '';
}

/* ---- weeks ---- */
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0); }
function mondayOf(d){ var x=new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12,0,0); var dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function weekLabel(ws){ var a=parseYmd(ws), b=addDays(a,6); var l = MONTHS[a.getMonth()]+' '+a.getDate()+'–'+(a.getMonth()===b.getMonth()?'':MONTHS[b.getMonth()]+' ')+b.getDate(); return l; }

function parseBohRaw(str){ try{ var o = str ? JSON.parse(str) : {}; return (o && typeof o==='object') ? o : {}; }catch(e){ return {}; } }
// turn a stored week into the rows this page shows: stored people + seeded roster people, alphabetical
function buildWeek(rec, ws){
  var raw = rec ? parseBohRaw(rec.boh_data) : {};
  var seeded = seededNames();
  var sections = {};
  BOH_SECTIONS.forEach(function(s){
    var key = s[0], stored = cleanNames(raw[key] || {}), rows = {};
    Object.keys(stored).forEach(function(n){ var a = stored[n]; var arr=[]; for(var i=0;i<7;i++){ var v = a && a[i]; arr.push(v==null ? '' : String(v)); } rows[n] = arr; });
    Object.keys(seeded[key]).forEach(function(n){ if(!rows[n]) rows[n] = ['','','','','','','']; });
    sections[key] = rows;
  });
  var base = {}; BOH_SECTIONS.forEach(function(s){ base[s[0]] = {}; Object.keys(sections[s[0]]).forEach(function(n){ base[s[0]][n] = sections[s[0]][n].map(normShift); }); });
  var evs = null; try{ evs = rec && rec.event_data ? JSON.parse(rec.event_data) : null; }catch(e){ evs = null; }
  return {week_start:ws, id: rec ? rec.id : null, exists: !!rec, sections:sections, base:base, events:(Array.isArray(evs)?evs:null), pendingEvents:null, by: rec && rec.last_edited_by, at: rec && rec.last_edited_at};
}
async function loadWeeks(keepWs){
  var recs = await getJSON('darien_schedules?order=week_start.desc&limit=12&select=id,week_start,boh_data,event_data,last_edited_by,last_edited_at');
  var byWs = {}; recs.forEach(function(r){ byWs[r.week_start] = r; });
  var cur = mondayOf(new Date()), list = {};
  recs.forEach(function(r){ list[r.week_start] = 1; });
  list[ymd(cur)] = 1; list[ymd(addDays(cur,7))] = 1;                       // this week and next week can always be started
  var all = Object.keys(list).sort();
  weeks = all.map(function(ws){ return buildWeek(byWs[ws]||null, ws); });
  var want = keepWs || ymd(cur);
  idx = Math.max(0, all.indexOf(want)); if(all.indexOf(want)<0) idx = all.length-1;
}

/* ---- drawing ---- */
function render(){
  var w = weeks[idx]; if(!w) return;
  $('weeklabel').textContent = weekLabel(w.week_start); $('weeklabel').title = 'Week of '+weekLabel(w.week_start)+', '+addDays(parseYmd(w.week_start),6).getFullYear();
  $('prevWk').disabled = idx<=0; $('nextWk').disabled = false;
  var mon = parseYmd(w.week_start);
  var h = '<table class="xl"><thead><tr><th class="nm">Name</th>';
  var evs = w.pendingEvents || w.events || [];
  for(var i=0;i<7;i++){ var d=addDays(mon,i); h += '<th>'+DAYS[i]+'<br>'+MONTHS[d.getMonth()]+' '+d.getDate()+(evs[i]?'<div class="ev">'+esc(evs[i])+'</div>':'')+'</th>'; }
  h += '</tr></thead><tbody>';
  BOH_SECTIONS.forEach(function(s){
    var key=s[0], names = Object.keys(w.sections[key]).sort(alphaCmp);
    h += '<tr class="bar"><td colspan="8">'+esc(s[1])+'</td></tr>';
    if(!names.length) h += '<tr><td colspan="8" class="empty-note">nobody in '+esc(s[1])+'</td></tr>';
    names.forEach(function(n){
      h += '<tr><th class="nm" title="'+esc(n)+'">'+esc(n)+'</th>';
      for(var i=0;i<7;i++){
        var v = normShift(w.sections[key][n][i]);
        h += '<td class="'+shadeClass(v)+(looksBad(v)?' bad':'')+'"><input data-sec="'+key+'" data-name="'+esc(n)+'" data-di="'+i+'" value="'+esc(v)+'" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next"></td>';
      }
      h += '</tr>';
    });
  });
  h += '</tbody></table>';
  $('sheet').innerHTML = h;
  var banner = $('banner');
  if(!w.exists){ banner.textContent = 'Nothing is saved for this week yet. Type the schedule, then tap Save.'; banner.hidden = false; } else banner.hidden = true;
  var who = w.by ? ('Last saved by '+w.by+(w.at?' · '+new Date(w.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'')) : (w.exists ? '' : '');
  $('lastEdit').textContent = who;
  updateDirty();
}
function allInputs(){ return Array.prototype.slice.call($('sheet').querySelectorAll('input')); }
function collectChanges(){
  var w = weeks[idx], out = [];
  allInputs().forEach(function(inp){
    var sec=inp.dataset.sec, name=inp.dataset.name, di=+inp.dataset.di;
    var val = normShift(inp.value), was = (w.base[sec] && w.base[sec][name]) ? w.base[sec][name][di] : '';
    if(val !== was) out.push({sec:sec, name:name, di:di, val:val, bad:looksBad(val)});
  });
  return out;
}
function updateDirty(){
  var w0 = weeks[idx], n = collectChanges().length + ((w0 && w0.pendingEvents) ? 1 : 0), b = $('savebtn');
  allInputs().forEach(function(inp){ var td=inp.parentNode; var w=weeks[idx]; var was=(w.base[inp.dataset.sec]&&w.base[inp.dataset.sec][inp.dataset.name])?w.base[inp.dataset.sec][inp.dataset.name][+inp.dataset.di]:''; td.classList.toggle('chg', normShift(inp.value)!==was); });
  b.disabled = saving || n===0; b.className = n>0 && !saving ? 'on' : '';
  b.textContent = saving ? 'Saving…' : (n>0 ? 'Save ('+n+')' : 'Saved');
}
function isDirty(){ var w=weeks[idx]; return collectChanges().length>0 || !!(w && w.pendingEvents); }

/* ---- typing ---- */
document.addEventListener('input', function(e){
  var inp = e.target; if(!inp || !inp.dataset || !inp.dataset.sec) return;
  var td = inp.parentNode, v = normShift(inp.value);
  td.classList.remove('opener','closer'); var sc = shadeClass(v); if(sc) td.classList.add(sc);
  updateDirty();
});
document.addEventListener('change', function(e){           // tidy what was typed (4pm-c -> 4PM-C) when leaving the box
  var inp = e.target; if(!inp || !inp.dataset || !inp.dataset.sec) return;
  var v = normShift(inp.value); inp.value = v;
  var td = inp.parentNode; td.classList.toggle('bad', looksBad(v)); td.classList.remove('opener','closer'); var sc = shadeClass(v); if(sc) td.classList.add(sc);
  updateDirty();
});
document.addEventListener('keydown', function(e){          // Enter = next box down
  var inp = e.target; if(e.key!=='Enter' || !inp || !inp.dataset || !inp.dataset.sec) return;
  e.preventDefault();
  var list = allInputs(), i = list.indexOf(inp), di = inp.dataset.di, next = null;
  for(var k=i+1;k<list.length;k++){ if(list[k].dataset.di===di){ next=list[k]; break; } }
  inp.blur(); if(next){ next.focus(); if(next.select) next.select(); }
});

/* ---- saving: only the changed cells, merged into the newest saved copy, only the BOH column ---- */
async function save(){
  if(saving) return;
  var w = weeks[idx], changes = collectChanges();
  if(!changes.length && !w.pendingEvents) return;
  var bad = changes.filter(function(c){ return c.bad; });
  if(bad.length && !confirm(bad.length+' box'+(bad.length>1?'es don\u2019t':' doesn\u2019t')+' look like a time ('+bad.slice(0,3).map(function(c){return c.name+' '+DAYS[c.di]+': '+c.val;}).join(', ')+(bad.length>3?'…':'')+').\n\nSave anyway?')) return;
  saving = true; updateDirty();
  try{
    var who = (localStorage.getItem('boh_name')||'BOH') + ' (BOH page)', now = new Date().toISOString();
    var rec = null;
    if(w.id){ var rows = await getJSON('darien_schedules?id=eq.'+w.id+'&select=id,boh_data'); rec = rows[0]||null; }
    else { var rows2 = await getJSON('darien_schedules?week_start=eq.'+w.week_start+'&select=id,boh_data'); rec = rows2[0]||null; }   // someone may have started this week since you opened it
    var obj = rec ? parseBohRaw(rec.boh_data) : {MANAGERS:{},PIZZA:{},KITCHEN:{},PREP:{},BUS:{},DISH:{}};
    BOH_SECTIONS.forEach(function(s){ if(obj[s[0]] !== undefined || changes.some(function(c){return c.sec===s[0];})) obj[s[0]] = cleanNames(obj[s[0]]||{}); });
    changes.forEach(function(c){
      var sec = obj[c.sec] || (obj[c.sec] = {});
      if(!sec[c.name]) sec[c.name] = [null,null,null,null,null,null,null];
      sec[c.name][c.di] = c.val || null;
    });
    if(rec){
      var pbody = {boh_data: JSON.stringify(obj), last_edited_by: who, last_edited_at: now};
      if(w.pendingEvents) pbody.event_data = JSON.stringify(w.pendingEvents);          // only when a photo's Events row was read
      await req('darien_schedules?id=eq.'+rec.id, {method:'PATCH', headers:{'Content-Type':'application/json','Prefer':'return=minimal'}, body: JSON.stringify(pbody)});
    } else {
      await req('darien_schedules', {method:'POST', headers:{'Content-Type':'application/json','Prefer':'return=minimal'}, body: JSON.stringify({week_start: w.week_start, boh_data: JSON.stringify(obj), foh_data: JSON.stringify({SERVERS:{},BARTENDERS:{},HOSTS:{}}), cashier_data: '{}', driver_data: '{}', event_data: w.pendingEvents ? JSON.stringify(w.pendingEvents) : undefined, created_at: now, last_edited_by: who, last_edited_at: now})});
    }
    saving = false;
    await loadWeeks(w.week_start); render();
    toast('Saved \u2713');
  }catch(e){ saving = false; updateDirty(); toast('Could not save: '+e.message, true); }
}


/* ===== reading a schedule photo: these functions are copied unchanged from the Darien app ===== */
function normName(n){ return String(n==null?'':n).trim().toLowerCase().replace(/\s+/g,' '); }

function cellHasShift(v, cellType){
  return cellType === 'pair' ? (Array.isArray(v) && v[0]) : !!v;
}

function emptyShiftRow(){ return [null,null,null,null,null,null,null]; }

function callVision(base64, mediaType, promptText){
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': ANTHROPIC_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 8000,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
        { type: 'text', text: promptText }
      ]}]
    })
  }).then(function(response){ return response.json(); }).then(function(data){
    if(!data.content || !data.content[0]) throw new Error('No response from AI: ' + JSON.stringify(data));
    var text = data.content.filter(function(b){ return b.type === 'text' && b.text; }).map(function(b){ return b.text; }).join('').trim();
    text = text.replace(/```json\n?|```/g, '').trim();
    return JSON.parse(text);
  });
}

function mergeOrdered(schedSection, nameList){
  schedSection = schedSection || {};
  var byNorm = {};
  Object.keys(schedSection).forEach(function(k){ byNorm[normName(k)] = k; });
  var out = {}, used = {};
  (nameList || []).forEach(function(nm){
    if(nm == null) return;
    var nn = normName(nm); if(!nn || used[nn]) return; used[nn] = true;
    if(byNorm[nn]) out[byNorm[nn]] = schedSection[byNorm[nn]];
    else out[String(nm).trim()] = emptyShiftRow();
  });
  Object.keys(schedSection).forEach(function(k){
    var nn = normName(k); if(!used[nn]){ used[nn] = true; out[k] = schedSection[k]; }
  });
  return out;
}

function reconcileSectioned(schedObj, namesObj, sectionOrder){
  schedObj = schedObj || {}; namesObj = namesObj || {};
  var secs = (sectionOrder || []).slice();
  Object.keys(schedObj).concat(Object.keys(namesObj)).forEach(function(s){ if(secs.indexOf(s) < 0) secs.push(s); });
  var out = {};
  secs.forEach(function(sec){ out[sec] = mergeOrdered(schedObj[sec] || {}, namesObj[sec] || []); });
  return out;
}

async function repairRows(base64, mediaType, rows, knownNames, cellType, scopeLabel){
  rows = rows || {};
  var norms = {}; Object.keys(rows).forEach(function(k){ norms[normName(k)] = k; });
  var seen = {}, toCheck = [];
  (knownNames || []).concat(Object.keys(rows)).forEach(function(nm){
    var nn = normName(nm); if(!nn || seen[nn]) return; seen[nn] = true;
    var key = norms[nn]; var row = key ? rows[key] : null;
    var empty = !Array.isArray(row) || !row.some(function(v){ return cellHasShift(v, cellType); });
    if(empty) toCheck.push(key || String(nm).trim());
  });
  if(!toCheck.length) return rows;

  var fmtLine = cellType === 'pair'
    ? 'a 7-value array where each value is null or a ["start","endOrC"] pair (use "C" as the end for a closing shift), e.g. {"Jaime":[null,null,null,["4pm","C"],null,null,null]}'
    : 'a 7-value array of strings or null, preserving shift text exactly, e.g. {"Eddie":[null,null,null,null,null,"4pm",null]}';
  var p = 'This is a photo of a ' + scopeLabel + ' schedule grid. Rows are names (left column); '
    + 'the 7 columns are days in order: Mon, Tue, Wed, Thu, Fri, Sat, Sun.\n\n'
    + 'Read ONLY the rows for these specific people:\n'
    + toCheck.map(function(n){ return '- ' + n; }).join('\n') + '\n\n'
    + 'Each may work only a SINGLE shift the entire week, so the row is mostly blank with just one '
    + 'filled cell — look very carefully for that one cell. Colored cell backgrounds (green, yellow, etc.) '
    + 'are NOT empty: read the text inside them. A cell is null ONLY if it is truly blank.\n\n'
    + 'Return ONLY a JSON object (no markdown, no explanation) mapping each name above to ' + fmtLine + '.\n'
    + 'If a listed person truly has no shifts, return all nulls for them. If you cannot find a listed name in the image, omit that key.';

  var repaired = await callVision(base64, mediaType, p);
  if(repaired && typeof repaired === 'object' && !Array.isArray(repaired)){
    var rNorms = {}; Object.keys(repaired).forEach(function(k){ rNorms[normName(k)] = k; });
    toCheck.forEach(function(nm){
      var nn = normName(nm); var rKey = rNorms[nn]; if(!rKey) return;
      var row = repaired[rKey];
      if(!Array.isArray(row) || row.length !== 7) return;
      // For FOH, coerce a bare "4pm" string into ["4pm", null] so it renders.
      if(cellType === 'pair') row = row.map(function(v){ return (typeof v === 'string') ? [v, null] : v; });
      if(row.some(function(v){ return cellHasShift(v, cellType); })){
        rows[ norms[nn] || String(nm).trim() ] = row;
      }
    });
  }
  return rows;
}

async function readScheduleImage(dataUrl, type) {

    prompt = 'You are extracting a Front of House restaurant schedule from a photo or screenshot.\n\nThe schedule is a grid where rows are employee names and columns are days of the week (Monday through Sunday). Each cell contains either a start time, a start-end time range, or is blank/off.\n\nExtract EVERY employee and EVERY day. Do not skip anyone. Do not skip any days.\n\nMany cells have a colored background (green, yellow, etc.). A colored background does NOT mean the cell is empty — read the text inside colored cells exactly like white cells. A cell is null ONLY if it is truly blank. Before you finish, re-check every row against the image and confirm you did not leave any filled cell as null.\n\nReturn ONLY a valid JSON object with this exact structure — no markdown, no explanation, just raw JSON:\n{\n  "SERVERS": {"EmployeeName": [["startTime","endTimeOrC"],null,...]},\n  "BARTENDERS": {},\n  "HOSTS": {}\n}\n\nRules:\n- Use null for days off or blank cells\n- Each working day is an array: ["startTime", "endTime"] or ["startTime", "C"] for close or ["startTime", null] if no end shown\n- Preserve times exactly as written (e.g. "4pm", "10:30am", "4:30pm")\n- "C" means closing shift\n- Include ALL employees under each section\n- The 7 array positions correspond to Mon, Tue, Wed, Thu, Fri, Sat, Sun in order\n- If a section has no employees, use {}\n- Employee names must be first name only or first+last — strip any phone numbers or digits in parentheses (e.g. "Abby (630-880-4270)" becomes "Abby")\n- CRITICAL: Only include a person under a section if you can physically see their name listed under that SPECIFIC section\'s header in the photo. A person who works both Server and Bartender shifts will have TWO separate rows, one under each header, possibly with different shifts on different days -- do not copy one row\'s shifts into the other section just because it is the same person. If a name appears under only ONE section, leave them out of the others entirely.';
  } else if(type === 'CSH') {
    prompt = 'You are extracting a Cashier schedule from a photo or screenshot of a spreadsheet grid.\n\nCompleteness is the single most important thing. Many cells have a colored background (green, yellow, etc.). A colored background does NOT mean the cell is empty — read the text inside colored cells exactly like white cells.\n\nFollow this method exactly:\n1. Read down the left column and note EVERY cashier name, top to bottom.\n2. For each cashier, scan all 7 day columns left to right (Mon, Tue, Wed, Thu, Fri, Sat, Sun) and record the shift text in each cell.\n3. A cell is null ONLY if it is truly blank. If you can see any time or text in a cell, you MUST capture it.\n4. Before you finish, re-check every cashier row against the image and confirm you did not leave any filled cell as null.\n5. CRITICAL: Sunday is the 7th and last column. It is often cut off or hard to see. You MUST include it.\n\nReturn ONLY a valid JSON object with this exact structure — no markdown, no explanation, just raw JSON:\n{"CashierName": ["MonShift","TueShift","WedShift","ThuShift","FriShift","SatShift","SunShift"]}\n\nRules:\n- Use null ONLY for genuinely empty cells\n- Use the cashier\'s name only (ignore phone numbers in parentheses)\n- Preserve shift text exactly as written, including ranges and closing notation (e.g. "4pm", "4pm-c", "9am-3pm")\n- "c", "cl", or "close" at the end means a closing shift — keep it as written\n- The 7 values correspond to Mon, Tue, Wed, Thu, Fri, Sat, Sun in order\n- Include EVERY cashier listed, even ones with no shifts that week (use an all-null array)\n- Final check before answering: count the names in the left column of the image, then count the keys in your JSON. These two numbers MUST match.';
  } else {
    prompt = 'You are extracting a Driver schedule from a photo or screenshot of a spreadsheet grid.\n\nCompleteness is the single most important thing. Many cells have a colored background (green, yellow, etc.). A colored background does NOT mean the cell is empty — read the text inside colored cells exactly like white cells.\n\nFollow this method exactly:\n1. Read down the left column and note EVERY driver name, top to bottom.\n2. For each driver, scan all 7 day columns left to right (Mon, Tue, Wed, Thu, Fri, Sat, Sun) and record the shift text in each cell.\n3. A cell is null ONLY if it is truly blank. If you can see any time or text in a cell, you MUST capture it.\n4. Before you finish, re-check every driver row against the image and confirm you did not leave any filled cell as null.\n5. CRITICAL: Sunday is the 7th and last column. It is often cut off or hard to see. You MUST include it. If Sunday is blank for a driver use null, but if there is any text there you must capture it. Do not skip Sunday.\n\nReturn ONLY a valid JSON object with this exact structure — no markdown, no explanation, just raw JSON:\n{"DriverName": ["MonShift","TueShift","WedShift","ThuShift","FriShift","SatShift","SunShift"]}\n\nRules:\n- Use null ONLY for genuinely empty cells\n- Use the driver\'s name only (ignore phone numbers in parentheses)\n- Preserve shift text exactly as written, including ranges and closing notation (e.g. "4pm", "2pm-cl", "2pm - cl", "5pm -cl", "10:30am", "10:30am/4pm", "9am-4pm", "2pm-c")\n- "c", "cl", or "close" at the end means a closing shift — keep it as written\n- The 7 values correspond to Mon, Tue, Wed, Thu, Fri, Sat, Sun in order\n- Include EVERY driver listed, even drivers with no shifts that week (use an all-null array)\n- CRITICAL: Some drivers work only ONE shift the entire week, so their row has just a single filled cell and the other six are blank. These sparse single-shift rows are the easiest to accidentally skip — you MUST still include them as their own driver. Never merge or drop a row just because it is mostly empty.\n- Final check before answering: count the names in the left column of the image, then count the keys in your JSON. These two numbers MUST match. If they do not, you skipped a row — go back and find it.';
  }

  // PASS 1 — full schedule read (names + shifts)
  var sched = await callVision(base64, mediaType, prompt);

  // PASS 2 — names-only read, then reconcile so no row can be silently dropped.
  // If this pass fails for any reason, fall back to the pass-1 result.
  try {
    if(type === 'BOH') {
      var bohNames = await callVision(base64, mediaType, 'Look at this photo of a Back of House schedule. Read ONLY the employee names in the left column, grouped under their section headers. CRITICAL: Place each name ONLY in the section where it physically appears in the image. Do not move names between sections. Do not add names that do not appear in the image. Do not place a name under a section unless that name is visually listed under that section header in the photo. Ignore phone numbers or digits in parentheses. Return ONLY a JSON object, no markdown and no explanation, with exactly this structure: {"MANAGERS":[],"PIZZA":[],"KITCHEN":[],"DISH":[]} — put each name as a string in its section array, and use an empty array for any section that has no names.');
      sched = reconcileSectioned(sched, bohNames, ['MANAGERS','PIZZA','KITCHEN','DISH']);
    } else if(type === 'FOH') {
      var fohNames = await callVision(base64, mediaType, 'Look at this photo of a Front of House schedule. Read ONLY the employee names in the left column, grouped under their section headers. Do not read any day or shift columns. Include EVERY name in every section, even rows that look mostly blank. Ignore phone numbers or digits in parentheses. Return ONLY a JSON object, no markdown and no explanation, with exactly this structure: {"SERVERS":[],"BARTENDERS":[],"HOSTS":[]} — put each name as a string in its section array, and use an empty array for any section that has no names.');
      sched = reconcileSectioned(sched, fohNames, ['SERVERS','BARTENDERS','HOSTS']);
    } else if(type === 'CSH') {
      var cshNames = await callVision(base64, mediaType, 'Look at this photo of a cashier schedule. Read ONLY the left-most column (the list of cashier names), top to bottom. Do not read any day or shift columns. Include EVERY name, even rows where the rest of the row looks blank. Ignore any phone numbers or digits in parentheses. Return ONLY a JSON array of strings in top-to-bottom order, no markdown and no explanation, for example: ["Alyssa","Mayra","Jackson"]');
      if(Array.isArray(cshNames)) sched = mergeOrdered(sched, cshNames);
    } else {
      var drvNames = await callVision(base64, mediaType, 'Look at this photo of a driver schedule. Read ONLY the left-most column (the list of driver names), top to bottom. Do not read any day or shift columns. Include EVERY name, even rows where the rest of the row looks blank — a driver with only one shift all week still gets a row. Ignore any phone numbers or digits in parentheses. Return ONLY a JSON array of strings in top-to-bottom order, no markdown and no explanation, for example: ["AJ","Alex D","Andrew"]');
      if(Array.isArray(drvNames)) sched = mergeOrdered(sched, drvNames);
    }
  } catch(e) {
    console.warn('Name reconciliation pass failed; using single-pass result.', e);
  }

  // PASS 3 — targeted repair for rows that came back empty. Runs identically for
  // all three schedule types via the shared repairRows helper: any roster/seen
  // name with an all-empty row gets re-read in a focused call. This recovers the
  // classic "sparse single-shift row got skipped" case (e.g. a driver, cook, or
  // server who works one shift all week). It only ADDS shifts to empty rows.
  try {
    if(type === 'BOH') {
      var bohSecs = Object.keys(KNOWN_BOH);
      for(var bi=0; bi<bohSecs.length; bi++){
        var bsec = bohSecs[bi];
        var bohKnown = KNOWN_BOH[bsec].concat(customNamesForSection(bsec));
        sched[bsec] = await repairRows(base64, mediaType, sched[bsec] || {}, bohKnown, 'string', bsec + ' (Back of House)');
      }
    } else if(type === 'FOH') {
      var fohSecs = Object.keys(KNOWN_FOH);
      for(var fi=0; fi<fohSecs.length; fi++){
        var fsec = fohSecs[fi];
        var fohKnown = KNOWN_FOH[fsec].concat(customNamesForSection(fsec));
        sched[fsec] = await repairRows(base64, mediaType, sched[fsec] || {}, fohKnown, 'pair', fsec + ' (Front of House)');
      }
    } else if(type === 'CSH') {
      sched = await repairRows(base64, mediaType, sched, KNOWN_CASHIERS.concat(customNamesForSection('CASHIERS')), 'string', 'cashier');
    } else {
      sched = await repairRows(base64, mediaType, sched, KNOWN_DRIVER_NAMES.concat(customNamesForSection('DRIVERS')), 'string', 'driver');
    }
  } catch(e) {
    console.warn('Row repair pass failed; keeping reconciled result.', e);
  }


    return sched;
}

async function readEventsFromBOH(dataUrl) {
  var base64 = dataUrl.split(',')[1];
  var mediaType = dataUrl.split(';')[0].split(':')[1];
  var prompt = 'Look at this Back of House schedule photo. Near the top of the schedule grid, there is a row labeled "Events" in the leftmost column. This row lists special events (like Trivia, Bingo, Live Music, etc.) for specific days of the week. Look carefully for this row — it appears directly under the Date and Day rows, before the employee names begin.\n\nFor each of the 7 day columns (Monday through Sunday), read the event text in the Events row. If a day has no event text, use null.\n\nReturn ONLY a valid JSON array of exactly 7 values in Monday-to-Sunday order. No markdown, no explanation, just the array. Example: ["Trivia","Bingo","Live Music",null,null,null,null]\n\nIf you cannot find an Events row at all, return: [null,null,null,null,null,null,null]';
  try {
    var result = await callVision(base64, mediaType, prompt);
    if(Array.isArray(result) && result.length === 7) return result;
    return [null,null,null,null,null,null,null];
  } catch(e) {
    return [null,null,null,null,null,null,null];
  }
}
/* the few things those functions expect to exist */
var ANTHROPIC_KEY = '';
var KNOWN_BOH = {}, KNOWN_FOH = {}, KNOWN_CASHIERS = [], KNOWN_DRIVER_NAMES = [];
function refreshKnownBoh(){                       // the names the reader double-checks for an empty row
  var seeded = seededNames(), w = weeks[idx], mg = {'Mike B':1,'Lisa B':1,'Brett':1,'Steve':1};
  CUSTOM.forEach(function(p){ if(p.is_salaried) mg[p.name] = 1; });
  if(w) Object.keys(w.sections.MANAGERS||{}).forEach(function(n){ mg[n] = 1; });
  KNOWN_BOH = {MANAGERS:Object.keys(mg), PIZZA:Object.keys(seeded.PIZZA), KITCHEN:Object.keys(seeded.KITCHEN), PREP:Object.keys(seeded.PREP), BUS:Object.keys(seeded.BUS), DISH:Object.keys(seeded.DISH)};
}
function customNamesForSection(sec){
  var out = [], rev = {}; Object.keys(ROLE_TO_SECTION).forEach(function(r){ rev[ROLE_TO_SECTION[r]] = r; });
  CUSTOM.forEach(function(p){ if(p.is_salaried || REMOVED[p.name]) return; var roles=[]; try{ roles = JSON.parse(p.roles_json||'[]'); }catch(e){} if(roles.indexOf(rev[sec])>=0) out.push(p.name); });
  return out;
}

/* ---- the key (kept on this phone, same place the Darien app keeps it) ---- */
function loadKey(){
  try{ var q = new URLSearchParams(location.search).get('key'); if(q && q.indexOf('sk-ant-')===0){ localStorage.setItem('zp_anthropic_key', q); history.replaceState(null,'',location.pathname); } }catch(e){}
  ANTHROPIC_KEY = localStorage.getItem('zp_anthropic_key') || '';
}
function askKey(){
  return new Promise(function(resolve){
    var g = $('keyGate'); g.hidden = false; $('keyErr').textContent=''; $('keyInput').value=''; setTimeout(function(){ $('keyInput').focus(); }, 50);
    $('keyGo').onclick = function(){ var v=$('keyInput').value.trim(); if(v.indexOf('sk-ant-')!==0){ $('keyErr').textContent='That doesn\u2019t look right \u2014 it should start with sk-ant-'; return; } localStorage.setItem('zp_anthropic_key', v); ANTHROPIC_KEY=v; g.hidden=true; resolve(true); };
    $('keyCancel').onclick = function(){ g.hidden=true; resolve(false); };
  });
}
function setBusy(on, title, msg){ $('busy').hidden = !on; if(on){ $('busyTitle').textContent = title||'READING\u2026'; $('busyMsg').textContent = msg||''; } }

/* ---- photo -> a sized JPEG the AI can take ---- */
function prepImage(file){
  return new Promise(function(resolve, reject){
    var done = false; function fin(v){ if(done) return; done = true; resolve(v); }
    var fr = new FileReader();
    fr.onerror = function(){ if(!done){ done = true; reject(new Error('Could not open that photo')); } };
    fr.onload = function(){
      var url = fr.result, img = new Image();
      setTimeout(function(){ fin(url); }, 6000);          // if the phone stalls decoding it, send the photo as it is
      img.onload = function(){
        try{
          var max = 2400, w = img.naturalWidth, h = img.naturalHeight;
          if(!(Math.max(w,h) > max || file.size > 1800000)){ fin(url); return; }
          var s = Math.min(1, max/Math.max(w,h)), c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); fin(c.toDataURL('image/jpeg', 0.9));
        }catch(e){ fin(url); }
      };
      img.onerror = function(){ fin(url); };
      img.src = url;
    };
    fr.readAsDataURL(file);
  });
}

/* ---- what the AI read goes INTO the grid for her to check; nothing is saved until she taps Save ---- */
function applyParsed(data, events){
  var w = weeks[idx], cleaned = {}, changed = 0;
  BOH_SECTIONS.forEach(function(s){ cleaned[s[0]] = cleanNames((data && data[s[0]]) || {}); });
  BOH_SECTIONS.forEach(function(s){
    var key = s[0], rows = w.sections[key], parsed = cleaned[key];
    Object.keys(parsed).forEach(function(n){ if(!rows[n]){ rows[n] = ['','','','','','','']; w.base[key][n] = ['','','','','','','']; } });
    Object.keys(rows).forEach(function(n){          // the photo is the whole schedule: anything not in it is cleared
      var arr = parsed[n];
      for(var i=0;i<7;i++){ var v = (arr && arr[i]!=null && arr[i]!=='') ? String(arr[i]) : ''; rows[n][i] = v; }
    });
  });
  if(Array.isArray(events) && events.length===7 && events.some(function(e){ return e; })) w.pendingEvents = events.map(function(e){ return e ? String(e) : null; });
  render();
}
function seenAnyShift(data){ var any=false; BOH_SECTIONS.forEach(function(s){ var sec=data&&data[s[0]]; if(sec) Object.keys(sec).forEach(function(n){ if(Array.isArray(sec[n]) && sec[n].some(function(v){return v;})) any=true; }); }); return any; }

$('photoBtn').addEventListener('click', async function(){
  if(!ANTHROPIC_KEY){ var got = await askKey(); if(!got) return; }
  var w = weeks[idx];
  if(isDirty() && !confirm('You have changes that aren\u2019t saved. A photo will replace what\u2019s on screen.\n\nContinue?')) return;
  if(!confirm('Read a schedule photo into the week of '+weekLabel(w.week_start)+'?\n\nIt fills in the grid so you can check it. Nothing is saved until you tap Save.')) return;
  $('photoFile').value = ''; $('photoFile').click();
});
$('photoFile').addEventListener('change', async function(){
  var f = this.files && this.files[0]; if(!f) return;
  var w = weeks[idx];
  try{
    setBusy(true, 'READING THE PHOTO', 'This takes about a minute. Keep this screen open.');
    var dataUrl = await prepImage(f);
    refreshKnownBoh();
    var data = await readScheduleImage(dataUrl, 'BOH');
    if(!data || typeof data !== 'object' || !seenAnyShift(data)) throw new Error('I couldn\u2019t find a schedule in that photo. Try a clearer, straight-on picture of the whole grid.');
    $('busyMsg').textContent = 'Reading the events line\u2026';
    var ev = null; try{ ev = await readEventsFromBOH(dataUrl); }catch(e){ ev = null; }
    setBusy(false);
    applyParsed(data, ev);
    var n = collectChanges().length;
    toast('Photo read \u2014 check it, then tap Save ('+n+' change'+(n===1?'':'s')+')');
    $('sheet').scrollTop = 0;
  }catch(e){
    setBusy(false);
    var msg = String(e && e.message || e);
    if(/authentication|invalid x-api-key|invalid api key|401/i.test(msg)){ localStorage.removeItem('zp_anthropic_key'); ANTHROPIC_KEY=''; toast('That AI key was refused. Tap the photo button to enter it again.', true); }
    else toast('Could not read the photo: '+msg.slice(0,140), true);
  }
});
loadKey();

/* ---- buttons ---- */
function leaveOk(){ return !isDirty() || confirm('Throw away the changes you haven\u2019t saved?'); }
$('savebtn').addEventListener('click', save);
$('prevWk').addEventListener('click', function(){ if(idx>0 && leaveOk()){ idx--; render(); $('sheet').scrollTop=0; } });
$('nextWk').addEventListener('click', function(){
  if(!leaveOk()) return;
  if(idx>=weeks.length-1){                                              // one more week out
    var nxt = ymd(addDays(parseYmd(weeks[weeks.length-1].week_start), 7)); weeks.push(buildWeek(null, nxt));
  }
  idx++; render(); $('sheet').scrollTop=0;
});
$('refresh').addEventListener('click', async function(){ if(!leaveOk()) return; try{ var ws=weeks[idx].week_start; await loadRoster(); await loadWeeks(ws); render(); toast('Reloaded'); }catch(e){ toast('Could not reload: '+e.message, true); } });
$('signOut').addEventListener('click', function(e){ e.preventDefault(); if(isDirty() && !confirm('You have unsaved changes. Sign out anyway?')) return; localStorage.removeItem('boh_trusted_v1'); localStorage.removeItem('boh_name'); location.reload(); });

/* ---- sign in ---- */
function openApp(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}   // ask the phone to keep the sign-in, so the PIN is entered once and not again
  $('pinGate').hidden = true; $('nameGate').hidden = true;
  ['topbar','sheet','foot'].forEach(function(id){ $(id).hidden = false; });
  $('who').textContent = localStorage.getItem('boh_name') || '';
  (async function(){
    try{ await loadRoster(); await loadWeeks(); render(); }
    catch(e){ $('sheet').innerHTML = '<div style="padding:24px;color:var(--red)">Could not load the schedule: '+esc(e.message)+'<br><br>Check your connection, then tap \u27F3.</div>'; }
  })();
}
function needName(){ $('pinGate').hidden = true; $('nameGate').hidden = false; setTimeout(function(){ $('nameInput').focus(); }, 50); }
function afterPin(){ if(localStorage.getItem('boh_name')) openApp(); else needName(); }
$('pinGo').addEventListener('click', function(){
  if($('pinInput').value === BOH_PIN){ localStorage.setItem('boh_trusted_v1','1'); $('pinErr').textContent=''; afterPin(); }
  else { $('pinErr').textContent = 'Wrong PIN'; $('pinInput').value=''; }
});
$('pinInput').addEventListener('keydown', function(e){ if(e.key==='Enter') $('pinGo').click(); });
$('nameGo').addEventListener('click', function(){ var n=$('nameInput').value.trim(); if(!n){ $('nameErr').textContent='Enter your name'; return; } localStorage.setItem('boh_name', n); openApp(); });
$('nameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') $('nameGo').click(); });
if(localStorage.getItem('boh_trusted_v1')==='1'){ afterPin(); } else { setTimeout(function(){ $('pinInput').focus(); }, 50); }
</script>
